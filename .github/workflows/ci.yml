name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/apt-deps
        with:
          leg: build
      - name: Set up a scratch xfs
        run: |
          sudo modprobe xfs || true
          IMG="$RUNNER_TEMP/oans-scratch.img"
          truncate -s 2G "$IMG"
          mkfs.xfs -q -m reflink=1 "$IMG"
          sudo mkdir -p /mnt/oans-scratch
          sudo mount -o loop "$IMG" /mnt/oans-scratch
          sudo chmod 1777 /mnt/oans-scratch
      - name: New test, without the fix (expected to fail)
        env:
          DUPEREMOVE_TEST_DIR: /mnt/oans-scratch
        run: |
          git checkout origin/master -- src/fiemap.c src/fiemap.h
          make -s
          for i in 1 2 3 4 5; do
            DUPEREMOVE=./oans python3 tests/run.py 2>&1 | grep -a "unflushed\|AssertionError\|^OK\|FAILED" || true
          done
          git checkout HEAD -- src/fiemap.c src/fiemap.h
      - name: New test, with the fix
        env:
          DUPEREMOVE_TEST_DIR: /mnt/oans-scratch
        run: |
          make -s
          for i in 1 2 3 4 5; do
            DUPEREMOVE=./oans python3 tests/run.py 2>&1 | grep -a "unflushed\|AssertionError\|^OK\|FAILED" || true
          done
